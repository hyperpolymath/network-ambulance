[tools]
# Language runtimes
rust = "latest"
zig = "latest"
bun = "1.4"
denojs = "latest"

# Package managers
pnpm = "latest"
cargo = "latest"
go-task = "latest"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables

# Task runner alias
[alias]
task = "go-task"

[tasks.setup]
description = "Install pinned JS dev tools (Prettier) from bun.lock"
run = "bun install --frozen-lockfile"

# Tauri crate only; no Tauri CLI entrypoint in the repo, so frontend assets are not bundled
[tasks.build]
run = "cargo build --release --manifest-path src-tauri/Cargo.toml"

[tasks.test]
run = "cargo test --manifest-path src-tauri/Cargo.toml"

[tasks.lint]
depends = ["setup"]
run = "bunx --no-install --bun prettier --check ."

[tasks.fmt]
depends = ["setup"]
run = "bunx --no-install --bun prettier --write ."
