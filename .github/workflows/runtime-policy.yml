# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Runtime and package-manager policy check.
#
# Authority: hyperpolymath/standards LANGUAGE-POLICY.adoc §1.3–§1.4 (owner ruling
# 2026-10-14). Ordering: Bun (1st) > Deno (2nd) > pnpm (3rd) > npm (last resort).
#
# One manifest, every runtime: package.json is the only manifest, and
# `js-runtimes regen` writes bun.lock, deno.lock and pnpm-lock.yaml from it. Those
# three locks are ONE dependency graph locked three ways, not three toolchains;
# governance's "JS runtimes" jobs check each one against package.json.
#
# REPLACES npm-bun-blocker.yml, which failed any build carrying `bun.lockb` with
# the message "npm/bun artifacts detected. Use Deno instead." That gate blocked
# what is now the FIRST-choice runtime and mandated the second. It was present in
# 55 repositories.
#
# What this fails on, deliberately:
#   MIXED TOOLCHAINS -- an npm package-lock.json next to the js-runtimes locks.
#   That is real, actionable drift: two dependency graphs that can disagree.
# What it does NOT fail on:
#   The js-runtimes locks together, or any one runtime alone. npm is LAST but
#   PERMITTED; a deno.json is a notice (Deno is tier 2, LANGUAGE-POLICY §1.3).
#   The check reports the tiers in use so drift is visible without blocking
#   legitimate work.
name: Runtime Policy
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-policy:
    name: Runtime Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Report runtime tier and reject mixed toolchains
        run: |
          set -euo pipefail

          bun=0; deno=0; pnpm=0; npm=0; deno_cfg=0
          [ -f bun.lockb ] || [ -f bun.lock ]                 && bun=1  || true
          [ -f deno.lock ]                                    && deno=1 || true
          [ -f deno.json ] || [ -f deno.jsonc ]               && deno_cfg=1 || true
          [ -f pnpm-lock.yaml ]                               && pnpm=1 || true
          [ -f package-lock.json ]                            && npm=1  || true

          # bun, deno and pnpm locks are the one graph js-runtimes regen writes.
          regen=$((bun + deno + pnpm))

          if [ $((regen + npm + deno_cfg)) -eq 0 ]; then
            echo "::notice::No JS package manager in use — nothing to check."
            exit 0
          fi

          # Report the tiers actually in use (LANGUAGE-POLICY.adoc §1).
          [ "$bun"  -eq 1 ] && echo "Bun   — tier 1 (preferred)"
          [ "$deno" -eq 1 ] && echo "Deno  — tier 2"
          [ "$deno_cfg" -eq 1 ] && echo "::notice::A deno.json is authored for Deno (tier 2, permitted; notice only, LANGUAGE-POLICY.adoc §1.3). Keep scripts in package.json so Bun runs them too."
          [ "$pnpm" -eq 1 ] && echo "pnpm  — tier 3"
          [ "$npm"  -eq 1 ] && echo "::warning::npm lockfile present. npm is tier 4, the last resort — permitted, never preferred. A standalone package-lock.json is permitted; it is rejected only beside a js-runtimes lock (standards#67). See LANGUAGE-POLICY.adoc §1.4."

          if [ "$npm" -eq 1 ] && [ "$regen" -gt 0 ]; then
            echo "::error::Mixed toolchains: package-lock.json sits next to the js-runtimes locks."
            echo "Two dependency graphs that can disagree is real drift. Delete package-lock.json"
            echo "and let 'js-runtimes regen' write bun.lock, deno.lock and pnpm-lock.yaml."
            exit 1
          fi

          echo "✅ One dependency graph in use."
